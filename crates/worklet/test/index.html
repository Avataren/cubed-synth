<!doctype html>
<meta charset="utf-8">
<title>cubed-worklet browser test</title>
<script type="module">
// Renders the mixer offline through the real AudioWorkletProcessor and
// checks the samples: a 0.25 DC clip on bus 1 (the bus at -6 dB, so 0.125),
// then silence once it ends; and telemetry with meters and an Ended event.
// Then an AHX song sent as a file, played through a low-pass effect, and a
// MOD module.
// Puts the outcome in `window.result` for test/run.mjs.
const RATE = 48000;
const CLIP_FRAMES = 12000;

// The commands this needs, encoded as cubed_mixer::wire does.
function setBus(bus, gainDb) {
  const v = new DataView(new ArrayBuffer(17));
  v.setUint8(0, 1); v.setUint16(1, bus, true); v.setUint16(3, 0, true);
  v.setFloat32(5, gainDb, true); v.setFloat32(9, 0, true); v.setUint8(13, 0);
  v.setUint16(14, 0xffff, true); v.setUint8(16, 0); // no ducking
  return new Uint8Array(v.buffer);
}
function play(voice, clip, bus) {
  const v = new DataView(new ArrayBuffer(41));
  v.setUint8(0, 11); v.setBigUint64(1, BigInt(voice), true); v.setUint32(9, clip, true);
  v.setUint16(13, bus, true); v.setFloat32(15, 1, true); v.setFloat32(19, 1, true);
  v.setFloat32(23, 0, true); v.setUint8(27, 0); v.setUint8(28, 128); v.setUint8(29, 0);
  v.setBigUint64(30, 0n, true); v.setUint8(38, 0); // not spatial
  return new Uint8Array(v.buffer, 0, 39);
}
function playSource(voice, source, bus) {
  const v = new DataView(new ArrayBuffer(34));
  v.setUint8(0, 21); v.setBigUint64(1, BigInt(voice), true); v.setUint32(9, source, true);
  v.setUint16(13, bus, true); v.setFloat32(15, 1, true); v.setFloat32(19, 0, true);
  v.setUint8(23, 128); v.setUint8(24, 0); v.setBigUint64(25, 0n, true); v.setUint8(33, 0);
  return new Uint8Array(v.buffer);
}

async function mixerNode(context, onMessage) {
  await context.audioWorklet.addModule('../js/cubed-worklet.js');
  const node = new AudioWorkletNode(context, 'cubed-mixer', {
    numberOfInputs: 0,
    outputChannelCount: [2],
  });
  node.connect(context.destination);
  const ready = new Promise((resolve, reject) => {
    node.port.onmessage = (event) => {
      const m = event.data;
      if (m.type === 'ready') resolve();
      else if (m.type === 'error') reject(new Error(m.message));
      else onMessage(m);
    };
  });
  const wasm = await (await fetch('../../../target/wasm32-unknown-unknown/release/cubed_worklet.wasm')).arrayBuffer();
  node.port.postMessage({ type: 'init', wasm, maxVoices: 0, maxBuses: 0, maxClips: 0, seedLo: 1, seedHi: 0 });
  return { node, ready };
}

async function clip() {
  const context = new OfflineAudioContext(2, RATE, RATE);
  const telemetry = [];
  const { node, ready } = await mixerNode(context, (m) => { if (m.type === 'telemetry') telemetry.push(m); });
  node.port.postMessage({ type: 'clip', id: 0, sampleRate: RATE, left: new Float32Array(CLIP_FRAMES).fill(0.25) });
  const commands = new Uint8Array([...setBus(1, -6.0206), ...play(7, 0, 1)]);
  node.port.postMessage({ type: 'commands', bytes: commands.buffer }, [commands.buffer]);
  await ready;
  const buffer = await context.startRendering();
  const left = buffer.getChannelData(0);
  const first = left.findIndex((s) => s !== 0);
  const during = left[first + 6000];
  const after = left[first + CLIP_FRAMES + 500];
  const events = telemetry.flatMap((t) => [...new Uint8Array(t.events)].length ? [new Uint8Array(t.events)] : []);
  const bus1Peak = Math.max(...telemetry.map((t) => t.meters[5 + 1]));
  return {
    ok: first >= 0 && first < 256 && Math.abs(during - 0.125) < 1e-3 && after === 0 && events.length > 0 && bus1Peak > 0.12,
    first, during, after, telemetry: telemetry.length, eventMessages: events.length,
    endedTag: events.length ? events[0][0] : null, bus1Peak,
  };
}

async function song() {
  // Fetched first: an offline render takes messages sent before 'ready'.
  const bytes = await (await fetch('../../ahx/tests/fixtures/songs/a_new_beginning.ahx')).arrayBuffer();
  const context = new OfflineAudioContext(2, RATE, RATE);
  const replies = [];
  const telemetry = [];
  const { node, ready } = await mixerNode(context, (m) => {
    if (m.type === 'song') replies.push(m);
    else if (m.type === 'telemetry') telemetry.push(m);
  });
  node.port.postMessage({ type: 'song', source: 0, format: 0, bytes, subsong: 0, looped: true }, [bytes]);
  node.port.postMessage({ type: 'song', source: 1, format: 7, bytes: new ArrayBuffer(4) });
  node.port.postMessage({ type: 'effect', bus: 2, slot: 0, kind: 2, params: new Float32Array([800, 0.707]) });
  const commands = new Uint8Array([...setBus(2, 0), ...playSource(1, 0, 2)]);
  node.port.postMessage({ type: 'commands', bytes: commands.buffer }, [commands.buffer]);
  await ready;
  const left = (await context.startRendering()).getChannelData(0);
  const rms = Math.sqrt(left.reduce((sum, s) => sum + s * s, 0) / left.length);
  const ok = replies.length === 2 && replies[0].ok && !replies[1].ok && rms > 0.01;
  const last = telemetry[telemetry.length - 1] ?? {};
  return { ok, rms, replies, voices: last.voices, rejected: last.rejected };
}

// A MOD module (format 3) played the same way.
async function module() {
  const bytes = await (await fetch('../../tracker/tests/fixtures/demo.mod')).arrayBuffer();
  const context = new OfflineAudioContext(2, RATE, RATE);
  const replies = [];
  const { node, ready } = await mixerNode(context, (m) => { if (m.type === 'song') replies.push(m); });
  node.port.postMessage({ type: 'song', source: 0, format: 3, bytes, subsong: 0, looped: true }, [bytes]);
  const commands = new Uint8Array([...setBus(2, 0), ...playSource(1, 0, 2)]);
  node.port.postMessage({ type: 'commands', bytes: commands.buffer }, [commands.buffer]);
  await ready;
  const left = (await context.startRendering()).getChannelData(0);
  const rms = Math.sqrt(left.reduce((sum, s) => sum + s * s, 0) / left.length);
  return { ok: replies.length === 1 && replies[0].ok && rms > 0.01, rms, replies };
}

function sourceEvent(voice, kind, note, velocity, duration) {
  const v = new DataView(new ArrayBuffer(23));
  v.setUint8(0, 24); v.setBigUint64(1, BigInt(voice), true); v.setUint8(9, kind);
  v.setUint8(10, note); v.setFloat32(11, velocity, true); v.setUint32(15, duration, true);
  return new Uint8Array(v.buffer, 0, 19);
}

// A DAW patch as a synth voice, played by a note event.
async function synth() {
  const bytes = await (await fetch('../../dsp/tests/real_patch.json')).arrayBuffer();
  const context = new OfflineAudioContext(2, RATE, RATE);
  const replies = [];
  const { node, ready } = await mixerNode(context, (m) => { if (m.type === 'song') replies.push(m); });
  node.port.postMessage({ type: 'synth', source: 0, bytes, oneShot: false }, [bytes]);
  const commands = new Uint8Array([...setBus(2, 0), ...playSource(1, 0, 2), ...sourceEvent(1, 0, 60, 1, 0)]);
  node.port.postMessage({ type: 'commands', bytes: commands.buffer }, [commands.buffer]);
  await ready;
  const left = (await context.startRendering()).getChannelData(0);
  const rms = Math.sqrt(left.reduce((sum, s) => sum + s * s, 0) / left.length);
  return { ok: replies.length === 1 && replies[0].ok && rms > 0.01, rms, replies };
}

function paramEvent(voice, nodeHi, nodeLo, param, value) {
  const v = new DataView(new ArrayBuffer(31));
  v.setUint8(0, 29); v.setBigUint64(1, BigInt(voice), true);
  v.setBigUint64(9, nodeLo, true); v.setBigUint64(17, nodeHi, true);
  v.setUint16(25, param, true); v.setFloat32(27, value, true);
  return new Uint8Array(v.buffer);
}
function fadeVoice(voice, gain, frames) {
  const v = new DataView(new ArrayBuffer(17));
  v.setUint8(0, 22); v.setBigUint64(1, BigInt(voice), true);
  v.setFloat32(9, gain, true); v.setUint32(13, frames, true);
  return new Uint8Array(v.buffer);
}
function stop(voice, frames) {
  const v = new DataView(new ArrayBuffer(13));
  v.setUint8(0, 15); v.setBigUint64(1, BigInt(voice), true); v.setUint32(9, frames, true);
  return new Uint8Array(v.buffer);
}

// A synth voice edited by a parameter event (the instrument gain closed), and
// a rebuilt synth swapped in for it with its held note and a crossfade.
async function synthEdit() {
  const patchBytes = await (await fetch('../../dsp/tests/real_patch.json')).arrayBuffer();
  const render = async (build) => {
    const context = new OfflineAudioContext(2, RATE, RATE);
    const replies = [];
    const telemetry = [];
    const { node, ready } = await mixerNode(context, (m) => {
      if (m.type === 'song') replies.push(m);
      else if (m.type === 'telemetry') telemetry.push(m);
    });
    build(node);
    await ready;
    const left = (await context.startRendering()).getChannelData(0);
    const rms = Math.sqrt(left.reduce((sum, s) => sum + s * s, 0) / left.length);
    return { rms, replies, telemetry, left };
  };
  const send = (node, ...parts) => {
    const bytes = new Uint8Array(parts.flatMap((p) => [...p]));
    node.port.postMessage({ type: 'commands', bytes: bytes.buffer }, [bytes.buffer]);
  };
  const start = (node) => {
    node.port.postMessage({ type: 'synth', source: 0, bytes: patchBytes.slice(0), oneShot: false });
    send(node, setBus(2, 0), playSource(1, 0, 2), sourceEvent(1, 0, 60, 1, 0));
  };
  const plain = await render(start);
  // PATCH (node 0), parameter 0: the instrument gain, to nothing.
  const quiet = await render((node) => { start(node); send(node, paramEvent(1, 0n, 0n, 0, 0)); });
  // The swap: a second synth with the held note and 4 warm-up blocks, crossfaded in.
  const swapped = await render((node) => {
    start(node);
    node.port.postMessage({ type: 'synth', source: 1, bytes: patchBytes.slice(0), oneShot: false, held: [[60, 1]], warmBlocks: 4 });
    const gain0 = playSource(2, 1, 2);
    new DataView(gain0.buffer).setFloat32(15, 0, true);
    send(node, gain0, fadeVoice(2, 1, 2400), stop(1, 2400));
  });
  const last = swapped.telemetry[swapped.telemetry.length - 1] ?? {};
  const ended = swapped.telemetry.some((t) => [...new Uint8Array(t.events)].includes(1));
  const ok = plain.replies[0]?.ok && plain.rms > 0.01 && quiet.rms < 0.05 * plain.rms
    && swapped.replies.length === 2 && swapped.replies.every((r) => r.ok)
    && swapped.rms > 0.5 * plain.rms && last.voices === 1 && ended;
  return { ok, plain: plain.rms, quiet: quiet.rms, swapped: swapped.rms, voices: last.voices, ended, replies: swapped.replies };
}

// Analysis taps: a bus tapped, the page gets its frames in 'taps' messages and
// reads them with the meters.
async function taps() {
  const context = new OfflineAudioContext(2, RATE, RATE);
  const messages = [];
  const replies = [];
  const telemetry = [];
  const { node, ready } = await mixerNode(context, (m) => {
    if (m.type === 'taps') messages.push(m);
    else if (m.type === 'tap') replies.push(m);
    else if (m.type === 'telemetry') telemetry.push(m);
  });
  node.port.postMessage({ type: 'clip', id: 0, sampleRate: RATE, left: new Float32Array(CLIP_FRAMES * 4).fill(0.25) });
  const commands = new Uint8Array([...setBus(1, -6.0206), ...play(7, 0, 1)]);
  node.port.postMessage({ type: 'commands', bytes: commands.buffer }, [commands.buffer]);
  node.port.postMessage({ type: 'tap', bus: 1, enable: true });
  node.port.postMessage({ type: 'tap', bus: 5, enable: true });
  await ready;
  await context.startRendering();
  const last = messages[messages.length - 1];
  const bus1 = last ? [...last.buses].indexOf(1) : -1;
  const frames = last?.frames ?? 0;
  const left = last ? last.data.subarray(bus1 * 2 * frames, bus1 * 2 * frames + frames) : [];
  const right = last ? last.data.subarray(bus1 * 2 * frames + frames, bus1 * 2 * frames + 2 * frames) : [];
  // Bus 1 at -6 dB with a 0.25 DC clip (centred, -3 dB pan law): 0.125 / sqrt(2) * ... just check it is steady and non-zero.
  const steady = left.length > 0 && left[frames - 1] > 0.05 && Math.abs(left[frames - 1] - left[frames - 500]) < 1e-3
    && Math.abs(left[frames - 1] - right[frames - 1]) < 1e-6;
  // Messages come about 40 times a second: a second of audio is 30 to 60 of them.
  const ok = replies.length === 2 && replies[0].ok && !replies[1].ok && last?.type === 'taps'
    && messages.length >= 25 && messages.length <= 60 && frames === 2048
    && last.written[bus1] > 40000 && steady && telemetry.length > 0;
  return { ok, messages: messages.length, frames, written: last?.written?.[bus1], replies, sample: left[frames - 1] };
}

// A swap warmed in slices: the old voice plays on while the rebuilt synth warms
// up a few blocks per quantum, then it takes over; the page is told twice.
async function swap() {
  const patchBytes = await (await fetch('../../dsp/tests/real_patch.json')).arrayBuffer();
  const context = new OfflineAudioContext(2, RATE * 2, RATE);
  const replies = [];
  const telemetry = [];
  const { node, ready } = await mixerNode(context, (m) => {
    if (m.type === 'swap') replies.push(m);
    else if (m.type === 'telemetry') telemetry.push(m);
  });
  const send = (...parts) => {
    const bytes = new Uint8Array(parts.flatMap((p) => [...p]));
    node.port.postMessage({ type: 'commands', bytes: bytes.buffer }, [bytes.buffer]);
  };
  node.port.postMessage({ type: 'synth', source: 0, bytes: patchBytes.slice(0), oneShot: false });
  send(setBus(2, 0), playSource(1, 0, 2), sourceEvent(1, 0, 60, 1, 0));
  // The notes have been held 300 blocks (0.8 s) when this comes; 4 blocks a quantum.
  node.port.postMessage({
    type: 'swap', source: 1, bytes: patchBytes.slice(0), play: playSource(2, 1, 2).buffer,
    oldVoice: 1, fadeFrames: 1200, held: [[60, 1]], warmBlocks: 300, sliceBlocks: 4,
  });
  // A swap for a voice that is not there fails at once.
  node.port.postMessage({
    type: 'swap', source: 1, bytes: patchBytes.slice(0), play: playSource(3, 1, 2).buffer,
    oldVoice: 77, fadeFrames: 1200, held: [], warmBlocks: 10,
  });
  await ready;
  const left = (await context.startRendering()).getChannelData(0);
  const rms = Math.sqrt(left.reduce((sum, s) => sum + s * s, 0) / left.length);
  const done = replies.find((r) => r.phase === 'done');
  const last = telemetry[telemetry.length - 1] ?? {};
  // 300 blocks at 4 a quantum against a clock that moves 1: about 100 quanta, 0.27 s.
  const ok = replies.map((r) => r.phase).join() === 'started,failed,done'
    && done && done.old === 1 && done.new === 2 && done.frame > 8000 && done.frame < 24000
    && rms > 0.01 && last.voices === 1;
  return { ok, rms, replies, voices: last.voices };
}

// A swap whose patch is so big that making room for it grows the wasm memory:
// the views must be taken after the pointer, or the buffer is detached and the
// swap never happens.
async function bigSwap() {
  const text = await (await fetch('../../dsp/tests/real_patch.json')).text();
  const patch = JSON.parse(text);
  patch.editor = { padding: 'x'.repeat(24 * 1024 * 1024) };
  const bytes = new TextEncoder().encode(JSON.stringify(patch));
  const context = new OfflineAudioContext(2, RATE, RATE);
  const replies = [];
  const { node, ready } = await mixerNode(context, (m) => { if (m.type === 'swap' || m.type === 'song') replies.push(m); });
  const send = (...parts) => {
    const b = new Uint8Array(parts.flatMap((p) => [...p]));
    node.port.postMessage({ type: 'commands', bytes: b.buffer }, [b.buffer]);
  };
  const small = await (await fetch('../../dsp/tests/real_patch.json')).arrayBuffer();
  node.port.postMessage({ type: 'synth', source: 0, bytes: small, oneShot: false });
  send(setBus(2, 0), playSource(1, 0, 2), sourceEvent(1, 0, 60, 1, 0));
  node.port.postMessage({
    type: 'swap', source: 1, bytes: bytes.buffer, play: playSource(2, 1, 2).buffer,
    oldVoice: 1, fadeFrames: 600, held: [[60, 1]], warmBlocks: 20, sliceBlocks: 4,
  });
  await ready;
  await context.startRendering();
  const phases = replies.filter((r) => r.type === 'swap').map((r) => r.phase).join();
  return { ok: phases === 'started,done', phases, replies };
}

// A module under live control in a real-time context: opened stopped and
// followed, seeked while stopped, looped, previewed, muted, played and stopped by
// wire commands; the page reads 'songpos' and 'songscope' messages.
const SONG = { play: 0, stop: 1, seek: 2, loopNone: 3, loopPattern: 4, loopRange: 5, mute: 6, solo: 7,
  muteMask: 8, soloMask: 9, previewOn: 10, previewOff: 11, looped: 12, scopes: 13 };
function songCommand(voice, kind, ...rest) {
  const v = new DataView(new ArrayBuffer(24));
  v.setUint8(0, 30); v.setBigUint64(1, BigInt(voice), true); v.setUint8(9, kind);
  const [a = 0, b = 0, c = 0, value = 0, frames = 0] = rest;
  v.setUint16(10, a, true); v.setUint16(12, b, true); v.setUint16(14, c, true);
  v.setFloat32(16, value, true); v.setUint32(20, frames, true);
  return new Uint8Array(v.buffer);
}

// One song's entry of a 'songpos' message, decoded as WebSong does.
function decodeSong(m, i) {
  const w = m.status.subarray(i * 12, i * 12 + 12);
  return {
    source: m.sources[i], playing: !!(w[0] & 1), preview: !!(w[0] & 2), alive: !!(w[0] & 4),
    scopes: !!(w[0] & 8), order: w[1], pattern: w[2], row: w[3], tick: w[4], speed: w[5], tempo: w[6],
    rows: w[7], frames: w[8] + w[9] * 2 ** 32, version: w[10], channels: w[11],
    levels: m.levels.subarray(i * 33, i * 33 + 33),
  };
}

async function songControlled() {
  const bytes = await (await fetch('../../tracker/tests/fixtures/demo.mod')).arrayBuffer();
  const context = new AudioContext({ sampleRate: RATE });
  const replies = [];
  const positions = [];
  const scopes = [];
  const { node, ready } = await mixerNode(context, (m) => {
    if (m.type === 'song') replies.push(m);
    else if (m.type === 'songpos') for (let i = 0; i < m.sources.length; i++) positions.push({ at: performance.now(), ...decodeSong(m, i) });
    else if (m.type === 'songscope') scopes.push(m);
  });
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const waitFor = async (predicate, ms = 3000, from = 0) => {
    const start = performance.now();
    while (performance.now() - start < ms) {
      const found = positions.slice(from).find(predicate);
      if (found) return found;
      await sleep(15);
    }
    return null;
  };
  const send = (...parts) => {
    const b = new Uint8Array(parts.flatMap((p) => [...p]));
    node.port.postMessage({ type: 'commands', bytes: b.buffer }, [b.buffer]);
  };
  await ready;
  node.port.postMessage({ type: 'song', source: 2, format: 3, bytes, subsong: 0, looped: true, stopped: true }, [bytes]);
  node.port.postMessage({ type: 'song', source: 3, format: 3, bytes: new ArrayBuffer(8), stopped: true });
  send(setBus(2, 0), playSource(5, 2, 2));
  const results = {};
  // Opened stopped: the first report says where it is.
  const first = await waitFor((p) => p.source === 2);
  results.first = first && { playing: first.playing, order: first.order, row: first.row, channels: first.channels, alive: first.alive, speed: first.speed, tempo: first.tempo };
  const openedOk = replies.length === 2 && replies[0].ok && !replies[1].ok;
  // A seek while stopped moves the position.
  send(songCommand(5, SONG.seek, 2, 8));
  const seeked = await waitFor((p) => p.order === 2 && p.row === 8 && !p.playing);
  // Scopes on, a range loop, and play.
  const mark = positions.length;
  send(songCommand(5, SONG.scopes, 0, 1), songCommand(5, SONG.loopRange, 2, 8, 11), songCommand(5, SONG.play));
  await sleep(900);
  const during = positions.slice(mark);
  const rows = [...new Set(during.map((p) => p.row))].sort((a, b) => a - b);
  const loudest = Math.max(...during.map((p) => Math.max(...p.levels.subarray(0, 4))));
  const ticks = new Set(during.map((p) => p.tick));
  const rate = during.length / 0.9;
  results.loop = { rows, loudest, ticks: ticks.size, count: during.length, rate };
  const lastScope = scopes[scopes.length - 1];
  const scopeOk = lastScope && lastScope.frames === 512 && lastScope.sources[0] === 2 && lastScope.channels[0] === 4
    && lastScope.data.length === 4 * 512 && lastScope.written[0] > 512
    && lastScope.data.some((s) => Math.abs(s) > 0.01);
  results.scope = lastScope && { frames: lastScope.frames, channels: [...lastScope.channels], data: lastScope.data.length, written: lastScope.written[0] };
  // A note preview over a muted song, held, then released.
  const markPreview = positions.length;
  send(songCommand(5, SONG.muteMask, 0, 0, 0, 0, 0b1111), songCommand(5, SONG.previewOn, 1, 60, 0, 1, 0));
  const previewed = await waitFor((p) => p.preview && p.playing && p.levels[4] > 0.01, 3000, markPreview);
  const markStop = positions.length;
  send(songCommand(5, SONG.previewOff), songCommand(5, SONG.muteMask, 0, 0, 0, 0, 0), songCommand(5, SONG.stop));
  const stopped = await waitFor((p) => !p.playing && !p.preview, 3000, markStop);
  // Stopping the voice frees the source on the next message, and the song is reported gone once.
  send(stop(5, 0));
  await sleep(100);
  send(setBus(3, 0));
  const gone = await waitFor((p) => !p.alive);
  await context.close();
  results.checks = {
    openedOk, first: !!first && !first.playing && first.order === 0 && first.row === 0 && first.channels === 4 && first.alive,
    seeked: !!seeked, rowsInRange: rows.length > 0 && rows.every((r) => r >= 8 && r <= 11) && rows.length >= 3,
    loud: loudest > 0.01, ticks: ticks.size >= 4, rate: rate > 25 && rate < 90, scopeOk: !!scopeOk,
    previewed: !!previewed, stopped: !!stopped, gone: !!gone,
  };
  results.ok = Object.values(results.checks).every(Boolean);
  return results;
}

// An Adlib Tracker II song under live control, the same way: opened stopped, followed,
// seeked, played, edited live (a cell, an instrument, the timing: wire tags 31, 32 and a
// song control), previewed and stopped.
function instrumentCommand(voice, number, fm, panning = 0, finetune = 0, voiceType = 0) {
  const v = new DataView(new ArrayBuffer(24));
  v.setUint8(0, 32); v.setBigUint64(1, BigInt(voice), true); v.setUint8(9, number);
  fm.forEach((b, i) => v.setUint8(10 + i, b));
  v.setUint8(21, panning); v.setInt8(22, finetune); v.setUint8(23, voiceType);
  return new Uint8Array(v.buffer);
}
function cellCommand(voice, pattern, row, channel, note, instrument, effect, param, period = 0) {
  const v = new DataView(new ArrayBuffer(21));
  v.setUint8(0, 31); v.setBigUint64(1, BigInt(voice), true);
  v.setUint16(9, pattern, true); v.setUint16(11, row, true); v.setUint8(13, channel);
  v.setUint8(14, note); v.setUint16(15, period, true); v.setUint8(17, instrument);
  v.setUint8(18, 0); v.setUint8(19, effect); v.setUint8(20, param);
  return new Uint8Array(v.buffer);
}

async function adlibControlled() {
  const bytes = await (await fetch('../../opl/tests/fixtures/a2m/NAB622/corridors of time.a2m')).arrayBuffer();
  const context = new AudioContext({ sampleRate: RATE });
  const replies = [];
  const positions = [];
  const { node, ready } = await mixerNode(context, (m) => {
    if (m.type === 'song') replies.push(m);
    else if (m.type === 'songpos') for (let i = 0; i < m.sources.length; i++) positions.push({ at: performance.now(), ...decodeSong(m, i) });
  });
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const waitFor = async (predicate, ms = 3000, from = 0) => {
    const start = performance.now();
    while (performance.now() - start < ms) {
      const found = positions.slice(from).find(predicate);
      if (found) return found;
      await sleep(15);
    }
    return null;
  };
  const send = (...parts) => {
    const b = new Uint8Array(parts.flatMap((p) => [...p]));
    node.port.postMessage({ type: 'commands', bytes: b.buffer }, [b.buffer]);
  };
  await ready;
  node.port.postMessage({ type: 'song', source: 2, format: 1, bytes, subsong: 0, looped: true, stopped: true }, [bytes]);
  node.port.postMessage({ type: 'song', source: 3, format: 1, bytes: new ArrayBuffer(8), stopped: true });
  node.port.postMessage({ type: 'song', source: 4, format: 0, bytes: new ArrayBuffer(8), stopped: true });
  send(setBus(2, 0), playSource(5, 2, 2));
  const first = await waitFor((p) => p.source === 2);
  const openedOk = replies.length === 3 && replies[0].ok && !replies[1].ok && !replies[2].ok;
  send(songCommand(5, SONG.seek, 1, 12));
  const seeked = await waitFor((p) => p.order === 1 && p.row === 12 && !p.playing);
  const mark = positions.length;
  const plain = [0x21, 0x31, 0x4f, 0x0b, 0xf2, 0xf1, 0x72, 0x7a, 0x03, 0x01, 0x0e];
  send(songCommand(5, SONG.play), songCommand(5, SONG.scopes, 0, 1),
    cellCommand(5, 1, 20, 2, 49, 1, 0x0c, 0x20, 0x0a03), instrumentCommand(5, 1, plain),
    songCommand(5, SONG.previewOn, 1, 60, 0, 1, 0));
  await sleep(900);
  const during = positions.slice(mark);
  const rows = [...new Set(during.map((p) => p.row))];
  const tracks = first ? first.channels : 0;
  const loudest = Math.max(...during.map((p) => Math.max(...p.levels.subarray(0, tracks))));
  const previewed = during.some((p) => p.preview && p.levels[tracks] > 0.001);
  send(songCommand(5, SONG.previewOff));
  const markStop = positions.length;
  send(songCommand(5, 14, 80, 4), songCommand(5, SONG.stop));
  const stopped = await waitFor((p) => !p.playing && p.tempo === 80 && p.speed === 4, 3000, markStop);
  send(stop(5, 0));
  await sleep(100);
  send(setBus(3, 0));
  const gone = await waitFor((p) => !p.alive);
  await context.close();
  const results = {
    first: first && { channels: first.channels, speed: first.speed, tempo: first.tempo },
    rows: rows.length, loudest, tracks,
  };
  results.checks = {
    openedOk, first: !!first && !first.playing && first.order === 0 && first.row === 0 && first.channels >= 9 && first.alive && first.speed > 0,
    seeked: !!seeked, moved: rows.length >= 3 && during.some((p) => p.playing && p.order === 1),
    loud: loudest > 0.001, previewed, stopped: !!stopped, gone: !!gone,
  };
  results.ok = Object.values(results.checks).every(Boolean);
  return results;
}
