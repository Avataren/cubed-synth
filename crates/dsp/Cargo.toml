[package]
name = "cubed-dsp"
description = "another_synth's synth engine: audio graph, oscillators, envelopes, filters, effects and patches"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["native-host"]
# wasm-bindgen classes and JS interop for the browser (another_synth's synth worklet).
wasm = [
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "getrandom/wasm_js",
]
# The native `AudioEngine` (audio_engine::native), the counterpart of the wasm one.
native-host = []
# std::simd on a nightly toolchain instead of the stable fallback.
nightly-simd = ["cubed-simd/nightly"]

[dependencies]
cubed-simd.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
once_cell.workspace = true
rustfft.workspace = true
hound.workspace = true
rand.workspace = true
base64.workspace = true
getrandom.workspace = true
rustc-hash.workspace = true
uuid.workspace = true
fft-convolver.workspace = true
rubato.workspace = true

wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "Crypto", "console", "Performance"] }
serde-wasm-bindgen = { workspace = true, optional = true }

[lints]
workspace = true

[[test]]
name = "engine_node_integration"
required-features = ["native-host"]

[[test]]
name = "envelope_preview"
required-features = ["native-host"]

[[bench]]
name = "patch_render"
harness = false
