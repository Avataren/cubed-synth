[package]
name = "cubed-mixer"
description = "A game audio mixer: named buses with inserts and sends, clip voices, and hosts for native output and the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Output to the default audio device through cpal, with lock-free rings
# between the game thread and the audio callback (`native::NativeHost`).
native = ["dep:cpal", "dep:rtrb"]
# Songs as sources: AHX/HVL, Adlib Tracker II and SID songs, and MOD, S3M
# and XM modules (`songs::open_song`).
songs = ["dep:cubed-ahx", "dep:cubed-opl", "dep:cubed-sid", "dep:cubed-tracker"]

[dependencies]
cubed-dsp = { path = "../dsp" }
cubed-ahx = { path = "../ahx", optional = true }
cubed-opl = { path = "../opl", optional = true }
cubed-sid = { path = "../sid", optional = true }
cubed-tracker = { path = "../tracker", optional = true }
cpal = { version = "0.18", optional = true }
rtrb = { version = "0.3", optional = true }

[lints]
workspace = true

[[example]]
name = "native_status"
required-features = ["native"]
